<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <title>PDF Minimal Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin:0; height:100%; }
    body { background:#f5f5f5; font-family: Arial, Helvetica, sans-serif; }
    #viewerContainer {
      box-sizing: border-box;
      padding: 12px;
      height: 100vh;
      overflow: auto;
    }
    .pageCanvas {
      display: block;
      margin: 12px auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      background: white;
    }
    .page-wrapper { text-align: center; }
    .loading {
      text-align:center; padding:30px; color:#666;
    }
  </style>

  <!-- Carga el motor pdf.js (build) -->
  <script src="../build/pdf.js"></script>
  <script>
    // Indica al worker dónde está
    pdfjsLib.GlobalWorkerOptions.workerSrc = "../build/pdf.worker.js";
  </script>
</head>
<body>
  <div id="viewerContainer">
    <div id="status" class="loading">Cargando documento…</div>
    <div id="pages"></div>
  </div>

  <script>
    (async function(){
      try {
        const params = new URLSearchParams(window.location.search);
        const fileUrl = params.get('file');
        const statusEl = document.getElementById('status');
        const pagesEl = document.getElementById('pages');

        if (!fileUrl) {
          statusEl.textContent = 'No se proporcionó el parámetro "file".';
          throw new Error('No file param');
        }

        statusEl.textContent = 'Descargando PDF...';

        // Request the PDF
        const loadingTask = pdfjsLib.getDocument(fileUrl);
        const pdf = await loadingTask.promise;

        statusEl.textContent = `Documento cargado. Páginas: ${pdf.numPages}`;

        // Render each page sequentially
        for (let p = 1; p <= pdf.numPages; p++) {
          statusEl.textContent = `Renderizando página ${p} / ${pdf.numPages}...`;

          const page = await pdf.getPage(p);
          const viewport = page.getViewport({ scale: 1.3 });

          // wrapper
          const wrapper = document.createElement('div');
          wrapper.className = 'page-wrapper';

          // canvas
          const canvas = document.createElement('canvas');
          canvas.className = 'pageCanvas';
          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);

          wrapper.appendChild(canvas);
          pagesEl.appendChild(wrapper);

          const ctx = canvas.getContext('2d');

          const renderTask = page.render({
            canvasContext: ctx,
            viewport: viewport
          });

          await renderTask.promise;

          // optional: reduce memory by freeing page reference
          page.cleanup?.();
        }

        statusEl.style.display = 'none';
      } catch (err) {
        console.error(err);
        document.getElementById('status').textContent = 'Error cargando PDF: ' + (err.message || err);
      }
    })();
  </script>
</body>
</html>
